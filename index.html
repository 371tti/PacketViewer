<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Packet Diagram Generator</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:#fff; color:#1f2937; font-family:"UDEV Gothic NF",sans-serif; }
  body { min-height:100vh; }
  .tool { display:grid; grid-template-columns:340px minmax(0,1fr); min-height:100vh; }
  .controls { border-right:1px solid #cbd5e1; padding:14px; }
  textarea,select,input[type="number"],button { font:inherit; color:inherit; background:#fff; border:1px solid #94a3b8; border-radius:0; }
  textarea { width:100%; height:220px; resize:vertical; padding:8px; font-family:"UDEV Gothic NF",sans-serif; font-size:12px; line-height:1.55; word-break:break-all; }
  select,input[type="number"] { width:100%; height:34px; padding:4px 6px; }
  label.field { display:block; margin:0 0 10px; font-size:12px; }
  label.field > span { display:block; margin:0 0 3px; }
  .row { display:grid; grid-template-columns:1fr 88px 104px; gap:6px; margin-top:10px; }
  .checks { display:flex; flex-wrap:wrap; gap:12px; padding:10px 0; border-top:1px solid #e2e8f0; border-bottom:1px solid #e2e8f0; margin:2px 0 10px; font-size:12px; }
  .checks label { white-space:nowrap; }
  input[type="checkbox"] { margin:0 4px 0 0; vertical-align:-1px; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; }
  button { height:34px; padding:0 10px; cursor:pointer; }
  button:hover { background:#f1f5f9; }
  button:disabled { color:#94a3b8; cursor:not-allowed; }
  .status { min-height:18px; margin:8px 0 0; font-size:11px; color:#b42318; white-space:pre-wrap; }
  .preview { overflow:auto; padding:14px; }
  .preview svg { display:block; max-width:none; height:auto; }
  @media (max-width:900px) { .tool { grid-template-columns:1fr; } .controls { border-right:0; border-bottom:1px solid #cbd5e1; } }
</style>
</head>
<body>
<div class="tool">
  <div class="controls">
    <textarea id="hex" spellcheck="false"></textarea>
    <div class="row">
      <label class="field"><span>形式</span><select id="mode">
        <option value="auto">自動</option>
        <option value="ethernet">Ethernet II</option>
        <option value="ipv4">IPv4</option>
        <option value="ipv6">IPv6</option>
        <option value="raw">Raw</option>
      </select></label>
      <label class="field"><span>1行</span><input type="number" id="cols" min="8" max="36" value="26"></label>
      <label class="field"><span>ASCII上限</span><input type="number" id="asciilimit" min="16" max="8000" value="256"></label>
      <label class="field"><span>HEX上限</span><input type="number" id="hexlimit" min="16" max="8000" value="256"></label>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="showNames" checked>セグメント名</label>
      <label><input type="checkbox" id="showHex" checked>HEX</label>
      <label><input type="checkbox" id="showDecode" checked>デコード結果</label>
    </div>
    <div class="actions">
      <button type="button" id="sample">サンプル</button>
      <button type="button" id="saveSvg">SVG保存</button>
      <button type="button" id="savePng">PNG保存</button>
    </div>
    <div class="status" id="error"></div>
  </div>
  <div class="preview" id="view"></div>
</div>
<script>
(()=>{
'use strict';
const EXAMPLE='bc241186b507bc2411a2acbc080045000054e6ab400040013fb30a0400200a0400230800fd79fe1800016cfebe6a0000000005300d0000000000101112131415161718191a1b1c1d1e1f202122232425262728292a2b2c2d2e2f3031323334353637';
const $=id=>document.getElementById(id);
const C={dst:'#2066CE',src:'#0C987C',etype:'#BC7C00',ip:'#7444B3',icmp:'#C0425F',app:'#B08615',data:'#0795B5',plain:'#5C6B82',sep:'#64748B',ipSource:'#0072CE',ipDestination:'#D92D20',hop:'#B54708',protocol:'#6941C6',flags:'#C11574',type:'#D97706',code:'#0E7490',length:'#087E8B',checksum:'#087A4A'};
const BG={ether:['#F8FAFC','#9AA7B6'],ip:['#F8F5FF','#9B86C8'],icmp:['#FFF5F6','#C97F91'],app:['#FFFAF0','#C49B55'],data:['#F0FBFD','#6AAEBA']};
const family='"UDEV Gothic NF", sans-serif';
const mono=family;
let sourceSVG='';
const canvas=document.createElement('canvas'),measure=canvas.getContext('2d');
const width=(s,size=18,kind='sans')=>{measure.font=`700 ${size}px ${kind==='mono'?mono:family}`;return measure.measureText(s).width;};
const escapeXML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const fmt=n=>Number(n.toFixed(2));
const hex2=v=>v.toString(16).padStart(2,'0');
const hex4=v=>'0x'+v.toString(16).padStart(4,'0');
const u16=(a,i)=>a[i]*256+a[i+1];
const u32=(a,i)=>(a[i]*16777216+a[i+1]*65536+a[i+2]*256+a[i+3])>>>0;
const fmtMac=(a,i)=>Array.from(a.slice(i,i+6)).map(hex2).join(':');
const fmtIP4=(a,i)=>Array.from(a.slice(i,i+4)).join('.');
function fmtIP6(a,i){
  const words=Array.from({length:8},(_,k)=>u16(a,i+2*k));
  let best=-1,count=0;
  for(let x=0;x<8;){if(words[x]!==0){x++;continue;}let y=x;while(y<8&&words[y]===0)y++;if(y-x>count&&y-x>1){best=x;count=y-x;}x=y;}
  if(best<0)return words.map(x=>x.toString(16)).join(':');
  const left=words.slice(0,best).map(x=>x.toString(16)).join(':');
  const right=words.slice(best+count).map(x=>x.toString(16)).join(':');
  return left+'::'+right;
}
function parseHex(raw){
  let s=raw.trim();if(!s)throw Error('HEXを入力してください。');
  s=s.replace(/0x/gi,'').replace(/[\s:,_-]/g,'');
  if(!/^[0-9a-fA-F]+$/.test(s))throw Error('HEX以外の文字が含まれています。');
  if(s.length%2)throw Error('HEXの桁数が奇数です。1バイトは2桁です。');
  if(s.length>16000)throw Error('最大8,000バイトまで対応しています。');
  const a=new Uint8Array(s.length/2);
  for(let i=0;i<a.length;i++)a[i]=parseInt(s.slice(2*i,2*i+2),16);
  return a;
}
function asciiTokens(a,start,end){
  const tokens=[];
  for(let i=start;i<end;i++){
    const v=a[i];
    tokens.push(v===10?'\\n':v===13?'\\r':v===9?'\\t':v>=32&&v<=126?String.fromCharCode(v):'·');
  }
  return tokens;
}
function asciiPreview(a,start,end,limit){
  const upto=Math.min(end,start+limit),tokens=asciiTokens(a,start,upto);
  const out=[],cap=70;
  let buf='';
  for(const token of tokens){if(buf.length+token.length>cap){out.push(buf);buf='';}buf+=token;}
  if(buf||!out.length)out.push(buf);
  return {lines:out,shown:upto-start,omitted:end-upto};
}
function asciiFlat(a,s,e,max=150){return asciiTokens(a,s,Math.min(e,s+max)).join('');}
function parseDNS(a,start,end){
  if(end-start<12)return null;
  let id=u16(a,start),flags=u16(a,start+2),qd=u16(a,start+4),an=u16(a,start+6),ns=u16(a,start+8),ar=u16(a,start+10);
  let name='';
  if(qd){
    const labels=[];let i=start+12,hops=0;
    while(i<end&&hops++<80){
      const n=a[i++];if(n===0)break;
      if((n&0xc0)===0xc0){if(i>=end)break;const ptr=((n&0x3f)<<8)|a[i++];labels.push(`↪${ptr}`);break;}
      if(n>63||i+n>end){labels.push('…');break;}
      const part=asciiFlat(a,i,i+n,63);labels.push(part);i+=n;
    }
    name=labels.join('.');if(name.length>78)name=name.slice(0,75)+'…';
  }
  return {id,flags,qd,an,ns,ar,name};
}
function parseDHCP(a,start,end){
  if(end-start<240||u32(a,start+236)!==0x63825363)return null;
  const types={1:'Discover',2:'Offer',3:'Request',4:'Decline',5:'ACK',6:'NAK',7:'Release',8:'Inform'};
  let msgType=null,off=start+240,steps=0;
  while(off<end&&steps++<1024){const tag=a[off++];if(tag===255)break;if(tag===0)continue;
    if(off>=end)break;const len=a[off++];if(off+len>end)break;
    if(tag===53&&len>=1)msgType=types[a[off]]||`Type ${a[off]}`;
    off+=len;
  }
  return {type:msgType||'BOOTP',op:a[start],xid:u32(a,start+4),yiaddr:fmtIP4(a,start+16),chaddr:fmtMac(a,start+28)};
}
function detectTLS(a,s,e){
  if(e-s<5)return null;
  const kind=a[s],maj=a[s+1],min=a[s+2],len=u16(a,s+3);
  if(![20,21,22,23,24].includes(kind)||maj!==3||min>4)return null;
  const names={20:'ChangeCipherSpec',21:'Alert',22:'Handshake',23:'Application Data',24:'Heartbeat'};
  const hs={1:'ClientHello',2:'ServerHello',4:'NewSessionTicket',8:'EncryptedExtensions',11:'Certificate',13:'CertificateRequest',15:'CertificateVerify',20:'Finished'};
  const subtype=kind===22&&e-s>5?` / ${hs[a[s+5]]||'Handshake '+a[s+5]}`:'';
  return {label:`TLS record`,description:`${names[kind]}${subtype} / Version 0x${hex2(maj)}${hex2(min)} / Length ${len} B`,header:5};
}
function readHTTP(a,s,e){
  const str=asciiFlat(a,s,Math.min(e,s+300));
  if(!/^(?:GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS|CONNECT|TRACE) [^\r\n]{1,140} HTTP\/\d\.\d|^HTTP\/\d\.\d \d{3}/.test(str))return null;
  const first=str.split(/\\r\\n|\\n|\\r/)[0].slice(0,100);
  const host=(str.match(/(?:^|\\r\\n)Host:\s*(.*?)(?:\\r\\n|\\n|$)/i)||[])[1];
  return {first,host};
}
function readTextProtocol(a,s,e){
  const str=asciiFlat(a,s,Math.min(e,s+150));
  if(/^SSH-\d\.\d-/.test(str))return {name:'SSH',desc:str.split(/\\r|\\n/)[0].slice(0,95)};
  if(/^(HELO|EHLO|MAIL FROM:|RCPT TO:|DATA\\r|220 |250 |354 )/i.test(str))return {name:'SMTP',desc:str.split(/\\r|\\n/)[0].slice(0,95)};
  if(/^(USER |PASS |LIST|RETR |STOR |220 |331 |230 )/i.test(str))return {name:'FTP',desc:str.split(/\\r|\\n/)[0].slice(0,95)};
  if(/^(M-SEARCH |NOTIFY |HTTP\/1\.1 200 OK|SUBSCRIBE |UNSUBSCRIBE )/.test(str))return {name:'SSDP / HTTPU',desc:str.split(/\\r|\\n/)[0].slice(0,95)};
  return null;
}
function classify(a,opts={}){
  const N=a.length,p={layers:[],colors:new Array(N).fill('data'),decoder:[],labels:[],titleParts:[],warnings:[]};
  const mode=opts.mode||'auto',asciiLimit=opts.asciiLimit||256;
  const T=(text,color)=>({text:String(text),color});
  const line=(id,parts)=>p.decoder.push({id,parts});
  const label=(text,color,id)=>p.labels.push({text,color,id});
  function layer(id,name,start,end,color,bg){
    if(end<=start)return false;
    p.layers.push({id,name,start,end,color,bg});
    for(let i=start;i<end;i++)p.colors[i]=color;
    return true;
  }
  function dataLayer(start,end,isApp=false){
    if(end<=start)return;
    const key=isApp?'app':'data';
    if(!isApp){layer('data','Data',start,end,'data','data');label('    ','sep');label('Data','data','data');}
    line(key,[T(isApp?'Payload  ':'Data  ','plain'),T(`${end-start} B`,isApp?'app':'data')]);
    const result=asciiPreview(a,start,end,asciiLimit);
    for(let i=0;i<result.lines.length;i++)line(key,[T(i===0?'ASCII  ':'　        ','plain'),T(result.lines[i],isApp?'app':'data')]);
    if(result.omitted)line(key,[T(`… 残り ${result.omitted} BはASCII表示を省略（HEXは全件表示）`,'sep')]);
  }
  function application(name,summary,begin,end,details=[]){
    layer('app',name,begin,end,'app','app');label('    ','sep');label(name,'app','app');
    p.titleParts.push(name);
    line('app',[T(`${name}  `,'plain'),T(summary,'app')]);
    for(const [key,value] of details)line('app',[T(`${key}  `,'plain'),T(value,'app')]);
    dataLayer(begin,end,true);
  }
  let link=mode;
  if(link==='auto'){
    if(N>=14){
      const e=u16(a,12);
      link=[0x0800,0x86dd,0x0806,0x8100,0x88a8,0x88cc,0x8864].includes(e)?'ethernet':
        a[0]>>4===4&&N>=20?'ipv4':a[0]>>4===6&&N>=40?'ipv6':'ethernet';
    }else link=(a[0]>>4===4&&N>=20)?'ipv4':(a[0]>>4===6&&N>=40)?'ipv6':'raw';
  }
  let net=0,etherType=0,linkName='';
  if(link==='ethernet'){
    if(N<14)throw Error('Ethernet IIヘッダには最低14バイト必要です。入力形式を「生データ」にすることもできます。');
    etherType=u16(a,12);net=14;let tags=[];
    for(let k=0;k<4&&[0x8100,0x88a8,0x9100].includes(etherType);k++){
      if(net+4>N){p.warnings.push('VLANタグが途中で切れています。');break;}
      tags.push(u16(a,net)&0x0fff);etherType=u16(a,net+2);net+=4;
    }
    const ethernetNames={0x0800:'IPv4',0x86dd:'IPv6',0x0806:'ARP',0x88cc:'LLDP',0x8864:'PPPoE'};
    const eName=ethernetNames[etherType]||hex4(etherType);
    layer('ether','Ethernet II',0,N,'plain','ether');
    for(let i=0;i<6;i++)p.colors[i]='dst';for(let i=6;i<12;i++)p.colors[i]='src';for(let i=12;i<net;i++)p.colors[i]='etype';
    label('Ethernet II  ','plain','ether');label('宛先MAC','dst');label('  ·  ','sep');label('送信元MAC','src');label('  ·  ','sep');label(tags.length?`VLAN ×${tags.length}`:'EtherType','etype');
    line('ether',[T(`宛先MAC  ${fmtMac(a,0)}`,'dst'),T('    ·    ','sep'),T(`送信元MAC  ${fmtMac(a,6)}`,'src')]);
    line('ether',[T(`EtherType  ${eName} (${hex4(etherType)})${tags.length?' / VLAN ID '+tags.join(', '):''}`,'etype')]);
    p.titleParts.push('Ethernet II');
  }else if(link==='ipv4'){etherType=0x0800;net=0;}
  else if(link==='ipv6'){etherType=0x86dd;net=0;}
  else if(link==='raw'){
    layer('data','Raw Data',0,N,'data','data');label('Raw Data','data','data');p.titleParts.push('Raw');
    line('data',[T(`Raw Data  ${N} B`,'data')]);
    const preview=asciiPreview(a,0,N,asciiLimit);
    for(let i=0;i<preview.lines.length;i++)line('data',[T(i?'　        ':'ASCII  ','plain'),T(preview.lines[i],'data')]);
    if(preview.omitted)line('data',[T(`… 残り ${preview.omitted} BはASCII表示を省略`,'sep')]);
    return p;
  }else throw Error('入力形式が不正です。');
  if(net>=N){return p;}
  if(etherType===0x0806){
    if(N-net>=8){
      const htype=u16(a,net),ptype=u16(a,net+2),hlen=a[net+4],plen=a[net+5],opcode=u16(a,net+6);
      const arpEnd=net+8+2*(hlen+plen),end=Math.min(N,arpEnd);
      layer('ip','ARP',net,end,'ip','ip');label('    ','sep');label('ARP','ip','ip');p.titleParts.push('ARP');
      const opName=opcode===1?'Request':opcode===2?'Reply':`Opcode ${opcode}`;
      line('ip',[T('ARP  ','plain'),T(`${opName} / HTYPE ${htype} / PTYPE ${hex4(ptype)} / HLEN ${hlen} / PLEN ${plen}`,'ip')]);
      if(hlen===6&&plen===4&&ptype===0x0800&&N>=arpEnd){
        const sh=net+8,sp=sh+6,th=sp+4,tp=th+6;
        line('ip',[T('送信元  ','plain'),T(`${fmtIP4(a,sp)} (${fmtMac(a,sh)})`,'ip')]);
        line('ip',[T('宛先  ','plain'),T(`${fmtIP4(a,tp)} (${fmtMac(a,th)})`,'ip')]);
      }else p.warnings.push('ARPアドレス部は未対応の形式か、データ不足です。');
      if(N>arpEnd)p.warnings.push(`ARP後の${N-arpEnd} BはEthernetパディングの可能性があります。`);
    }else{p.warnings.push('ARPヘッダが途中で切れています。');dataLayer(net,N);}
    return p;
  }
  if(etherType===0x88cc){
    layer('app','LLDP',net,N,'app','app');label('    ','sep');label('LLDP','app','app');p.titleParts.push('LLDP');
    let o=net,tlvs=0,types=[];
    while(o+2<=N&&tlvs<64){const hdr=u16(a,o),type=hdr>>9,len=hdr&511;o+=2;if(o+len>N)break;tlvs++;types.push(type);o+=len;if(type===0)break;}
    line('app',[T('LLDP  ','plain'),T(`TLV ${tlvs}個 / Type ${types.slice(0,12).join(', ')}${types.length>12?'…':''}`,'app')]);
    dataLayer(net,N,true);return p;
  }
  if(etherType!==0x0800&&etherType!==0x86dd){
    if(etherType===0x8864){p.warnings.push('PPPoEセッションの内部プロトコル解析には未対応です。');}
    dataLayer(net,N);p.titleParts.push('Payload');return p;
  }

  let ipEnd=N,transport=net,proto=-1,netName='',fragment=false;
  if(etherType===0x0800){
    if(N-net<20||a[net]>>4!==4) {p.warnings.push('IPv4ヘッダが不足、またはVersionが不正です。');dataLayer(net,N);return p;}
    const ihl=(a[net]&15)*4,total=u16(a,net+2);
    if(ihl<20||net+ihl>N){p.warnings.push('IPv4ヘッダ長が不正または途中で切れています。');dataLayer(net,N);return p;}
    ipEnd=Math.min(N,net+Math.max(total,ihl));transport=net+ihl;proto=a[net+9];netName='IPv4';
    const ff=u16(a,net+6),flagNames=[];if(ff&0x4000)flagNames.push('DF');if(ff&0x2000)flagNames.push('MF');
    layer('ip','IPv4',net,ipEnd,'ip','ip');label('    ','sep');label('IPv4','ip','ip');p.titleParts.push('IPv4');
    line('ip',[T('IPv4  ','plain'),T(`${fmtIP4(a,net+12)} → ${fmtIP4(a,net+16)}`,'ip')]);
    line('ip',[T('ヘッダ  ','plain'),T(`TTL ${a[net+8]} / Total Length ${total} B / IHL ${ihl} B / Protocol ${proto}${flagNames.length?' / '+flagNames.join(', '):''}`,'ip')]);
    line('ip',[T('識別・検査  ','plain'),T(`Version ${a[net]>>4} / DSCP ${a[net+1]>>2} / ECN ${a[net+1]&3} / ID ${hex4(u16(a,net+4))} / Offset ${ff&0x1fff} / Checksum ${hex4(u16(a,net+10))}`,'ip')]);
    if(total<ihl)p.warnings.push('IPv4 Total Lengthがヘッダ長未満です。');
    if(net+total>N)p.warnings.push('IPv4パケットが途中で切れています。');
    if(net+total<N)p.warnings.push(`末尾${N-(net+total)} BはEthernetパディング等として解析対象外です。`);
    if(ff&0x1fff){fragment=true;p.warnings.push('後続IPv4フラグメントのためトランスポートヘッダを解析しません。');}
    else if(ff&0x2000)p.warnings.push('IPv4フラグメント（先頭）です。上位データが途中の場合があります。');
  }else{
    if(N-net<40||a[net]>>4!==6){p.warnings.push('IPv6ヘッダが不足、またはVersionが不正です。');dataLayer(net,N);return p;}
    const plen=u16(a,net+4);ipEnd=plen===0?N:Math.min(N,net+40+plen);
    netName='IPv6';proto=a[net+6];transport=net+40;
    let extNames=[],count=0;
    while([0,43,44,51,60,135].includes(proto)&&count++<16&&transport+2<=ipEnd){
      const next=a[transport],kind=proto;
      let sz=kind===44?8:kind===51?(a[transport+1]+2)*4:(a[transport+1]+1)*8;
      if(sz<8||transport+sz>ipEnd){p.warnings.push('IPv6拡張ヘッダが途中で切れています。');fragment=true;break;}
      if(kind===44){const frag=u16(a,transport+2);if(frag&0xfff8){fragment=true;p.warnings.push('後続IPv6フラグメントは解析しません。');}}
      const names={0:'Hop-by-Hop',43:'Routing',44:'Fragment',51:'AH',60:'Destination',135:'Mobility'};
      extNames.push(names[kind]);transport+=sz;proto=next;
    }
    if(proto===50){fragment=true;p.warnings.push('ESPで暗号化されたペイロードは復号できません。');}
    layer('ip','IPv6',net,ipEnd,'ip','ip');label('    ','sep');label('IPv6','ip','ip');p.titleParts.push('IPv6');
    line('ip',[T('IPv6 送信元  ','plain'),T(fmtIP6(a,net+8),'ip')]);
    line('ip',[T('IPv6 宛先  ','plain'),T(fmtIP6(a,net+24),'ip')]);
    line('ip',[T('ヘッダ  ','plain'),T(`Hop Limit ${a[net+7]} / Payload Length ${plen} B / Next Header ${proto}`,'ip')]);
    line('ip',[T('制御情報  ','plain'),T(`Version ${a[net]>>4} / Traffic Class ${((a[net]&15)<<4)|(a[net+1]>>4)} / Flow Label ${((a[net+1]&15)<<16)|(a[net+2]<<8)|a[net+3]}`,'ip')]);
    if(extNames.length)line('ip',[T('拡張ヘッダ  ','plain'),T(extNames.join(' → '),'ip')]);
    if(plen!==0&&net+40+plen>N)p.warnings.push('IPv6パケットが途中で切れています。');

  const boxes=intervals.map(v=>({
    row:v.row,
    left:v.left-padX+sideInset,
    right:v.right+padX-sideInset,
    top:tops[v.row]-padY+vInset,
    bottom:tops[v.row]+heights[v.row]+padY-vInset
  }));
  for(let i=1;i<boxes.length;i++)if(boxes[i].row!==boxes[i-1].row+1)return '';
  const pts=[];
  const first=boxes[0],last=boxes.at(-1);
  pts.push([first.left,first.top],[first.right,first.top]);
  for(let i=0;i<boxes.length;i++){
    const cur=boxes[i];
    pts.push([cur.right,cur.bottom]);
    if(i<boxes.length-1){
      const next=boxes[i+1];
      const mid=(cur.bottom+next.top)/2-depth*0.75;
      pts.push([cur.right,mid],[next.right,mid],[next.right,next.top]);
    }
  }
  pts.push([last.left,last.bottom]);
  for(let i=boxes.length-1;i>=0;i--){
    const cur=boxes[i];
    pts.push([cur.left,cur.top]);
    if(i>0){
      const prev=boxes[i-1];
      const mid=(prev.bottom+cur.top)/2+depth*0.75;
      pts.push([cur.left,mid],[prev.left,mid],[prev.left,prev.bottom]);
    }
  }
  return polygonPath(pts);
}

function renderFlowToken(put,item,y,size,fam,mon){
  const familyName=item.mono?mon:fam;
  const weight=item.bold===false?500:700;
  const pad=item.badgePadX||0;
  const textW=item.textWidth??Math.max(1,item.width-pad*2);
  if(item.proto){
    const h=size+10;
    const top=y-size-4;
    put(`<rect x="${fmt(item.x1)}" y="${fmt(top)}" width="${fmt(item.width)}" height="${fmt(h)}" fill="${item.badgeBg||'#F7F8FA'}" stroke="${item.badgeStroke||'#A2ADBC'}" stroke-width="1.5"/>`);
  }
  put(`<text x="${fmt(item.x1+pad)}" y="${fmt(y)}" fill="${item.color}" font-family="${familyName}" font-size="${size}" font-weight="${weight}" textLength="${fmt(Math.max(1,textW))}" lengthAdjust="spacingAndGlyphs">${escapeXML(item.text)}</text>`);
}

function renderSVGv10(a,p,opts={}){
  const cols=opts.cols||26,asciiLimit=opts.asciiLimit||256;
  const fields=buildFields(a,p);
  const rows=fixedPacketRows(a.length,cols);
  // Wider fixed pitch deliberately leaves a real safety margin around each byte.
  const geom=fixedByteGeom(rows,40,54);
  const depths=layerDepths(p),maxDepth=Math.max(0,...depths.values());
  const layers=[...p.layers].sort((a,b)=>(depths.get(a)||0)-(depths.get(b)||0));
  const fullGridRight=Math.max(...rows.map(r=>geom.rowRight(r)));
  const targetW=Math.max(760,fullGridRight+60);
  const textMax=Math.max(660,targetW-geom.origin-52);

  const names=layoutFlowTokens(nameFlowTokens(fields),textMax,geom.origin,16);
  const flowBoxH=34,flowStride=52;
  const nameTops=[];let y=42;
  for(let i=0;i<names.length;i++){nameTops.push(y);y+=flowStride;}
  const nameBottom=names.length?nameTops.at(-1)+flowBoxH:42;

  const hexBoxH=38,hexStride=60,hexTops=[];
  y=nameBottom+58;
  for(let i=0;i<rows.length;i++){hexTops.push(y);y+=hexStride;}
  const hexBottom=rows.length?hexTops.at(-1)+hexBoxH:y;

  const decode=layoutFlowTokens(decodeFlowTokens(a,p,fields,asciiLimit),textMax,geom.origin,17);
  const decTops=[];
  y=hexBottom+61;
  for(let i=0;i<decode.length;i++){decTops.push(y);y+=flowStride;}
  const decBottom=decode.length?decTops.at(-1)+flowBoxH:y;
  const W=Math.ceil(targetW),H=Math.ceil(decBottom+18);

  const out=[],put=s=>out.push(s);
  const fam='UDEV Gothic NF, sans-serif';
  const mon=fam;
  const text=(x,yy,s,color,size=16,kind='sans',weight=700,anchor='start')=>put(`<text x="${fmt(x)}" y="${fmt(yy)}" fill="${color}" font-family="${kind==='mono'?mon:fam}" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}">${escapeXML(s)}</text>`);

  function drawLayerSet(zone,linesOrRows,tops,heights,intervalFn){
    for(const l of layers){
      const depth=depths.get(l)||0,c=BG[l.bg]||BG.ether;
      const ints=intervalFn(l);
      if(!ints.length)continue;
      // The full-packet outer envelope is intentionally a simple rectangle.
      // It cannot self-intersect or acquire a twisted step at a line wrap.
      if(depth===0&&l.start===0&&l.end>=a.length){
        const right=zone==='hex'
          ? Math.max(...rows.map(r=>geom.rowRight(r)))
          : Math.max(...linesOrRows.map(line=>geom.origin+line.width));
        const top=tops[0]-7,bottom=tops.at(-1)+heights.at(-1)+7;
        put(`<rect data-zone="${zone}" data-layer="${escapeXML(l.id)}" x="${fmt(geom.origin-11)}" y="${fmt(top)}" width="${fmt(right-geom.origin+22)}" height="${fmt(bottom-top)}" fill="${c[0]}" stroke="${c[1]}" stroke-width="1.8"/>`);
        continue;
      }
      const d=safeRibbonPath(ints,tops,heights,depth,maxDepth);
      if(d)put(`<path data-zone="${zone}" data-layer="${escapeXML(l.id)}" d="${d}" fill="${c[0]}" stroke="${c[1]}" stroke-width="1.8" stroke-linejoin="miter"/>`);
    }
  }

  put(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`);

  // 1) Segment names: one continuous flow across protocol boundaries.
  text(geom.origin-11,25,'セグメント名','#64748B',18);
  drawLayerSet('name',names,nameTops,names.map(()=>flowBoxH),l=>flowIntervalsForLayer(names,l));
  for(let r=0;r<names.length;r++)for(const item of names[r].items)renderFlowToken(put,item,nameTops[r]+24,16,fam,mon);

  // 2) HEX: byte positions depend only on byte index and fixed cell pitch.
  text(geom.origin-11,nameBottom+40,'HEX','#64748B',18);
  drawLayerSet('hex',rows,hexTops,rows.map(()=>hexBoxH),l=>intervalsForLayer(l,geom));
  const byteField=new Array(a.length);
  for(const f of fields)for(let i=f.start;i<f.end;i++)byteField[i]=f;
  for(let r=0;r<rows.length;r++){
    const row=rows[r];
    for(let i=row.start;i<row.end;i++){
      const xx=geom.centerFor(row,i);
      text(xx,hexTops[r]+25,hex2(a[i]),byteField[i]?.color||'#42526E',17,'mono',700,'middle');
    }
  }

  // 3) Decoded values: same flow engine and baseline rules as segment names.
  text(geom.origin-11,hexBottom+43,'デコード結果','#64748B',18);
  drawLayerSet('decode',decode,decTops,decode.map(()=>flowBoxH),l=>flowIntervalsForLayer(decode,l));
  for(let r=0;r<decode.length;r++)for(const item of decode[r].items)renderFlowToken(put,item,decTops[r]+25,17,fam,mon);

  put('</svg>');
  return out.join('\n');
}



// v11 renderer --------------------------------------------------------------
// Simplified nesting geometry:
//   <A <B <C <D >>>>
// A nested layer changes geometry only where it starts. From that point on,
// it fills to the common right/bottom edge of the section. Therefore closing
// edges never accumulate tiny per-row offsets and can never twist.

function firstFlowHit(lines,layer){
  for(let r=0;r<lines.length;r++){
    const hits=lines[r].items.filter(it=>it.kind==='token'&&it.start>=layer.start&&it.start<layer.end);
    if(hits.length)return {row:r,x:Math.min(...hits.map(it=>it.x1))};
  }
  return null;
}

function firstHexHit(layer,geom){
  for(let r=0;r<geom.rows.length;r++){
    const row=geom.rows[r];
    if(layer.start<row.end&&layer.end>row.start){
      const start=Math.max(layer.start,row.start);
      return {row:r,x:geom.xFor(row,start)};
    }
  }
  return null;
}

function startNotchPath(hit,tops,heights,zoneLeft,zoneRight,zoneBottom,leadPad=16){
  if(!hit)return '';
  const row=hit.row;
  const top=tops[row]-6;
  const startX=Math.max(zoneLeft, hit.x-leadPad);
  // If the layer starts at the visual line head after padding, use the same
  // breathing room as a normal rectangle.
  if(startX<=zoneLeft+1){
    return polygonPath([[zoneLeft,top],[zoneRight,top],[zoneRight,zoneBottom],[zoneLeft,zoneBottom]]);
  }
  // A layer occupies only the tail of its first row. After the following gutter
  // it spans the whole section width. This is the only step in the shape.
  if(row<tops.length-1){
    const rowBottom=tops[row]+heights[row]+6;
    const nextTop=tops[row+1]-6;
    const seam=(rowBottom+nextTop)/2;
    return polygonPath([
      [startX,top],
      [zoneRight,top],
      [zoneRight,zoneBottom],
      [zoneLeft,zoneBottom],
      [zoneLeft,seam],
      [startX,seam]
    ]);
  }
  // Started on the final row: no wrap exists, so a simple tail rectangle is enough.
  return polygonPath([[startX,top],[zoneRight,top],[zoneRight,zoneBottom],[startX,zoneBottom]]);
}

function renderSVGv17(a,p,opts={}){
  const cols=opts.cols||26,asciiLimit=opts.asciiLimit||256,hexLimit=opts.hexLimit||256;
  const showNames=opts.showNames!==false,showHex=opts.showHex!==false,showDecode=opts.showDecode!==false;
  if(!showNames&&!showHex&&!showDecode)throw Error('表示する項目を1つ以上選択してください。');

  const fields=buildFields(a,p);
  const hexCells=buildHexDisplayCells(a,fields,hexLimit);
  const rows=fixedPacketRows(hexCells.length,cols);
  const geom=fixedByteGeom(rows,40,54);
  const depths=layerDepths(p);
  const layers=[...p.layers].sort((a,b)=>(depths.get(a)||0)-(depths.get(b)||0));
  const fullGridRight=Math.max(...rows.map(r=>geom.rowRight(r)));
  const targetW=Math.max(760,fullGridRight+60);
  const textMax=Math.max(660,targetW-geom.origin-52);
  const flowBoxH=34,flowStride=52,hexBoxH=38,hexStride=60,sectionGap=58;

  const names=showNames?layoutFlowTokens(nameFlowTokens(fields),textMax,geom.origin,16):[];
  const decode=showDecode?layoutFlowTokens(decodeFlowTokens(a,p,fields,asciiLimit),textMax,geom.origin,17):[];

  let y=22;
  const nameTops=[];
  if(showNames){
    y+=20;
    for(let i=0;i<names.length;i++){nameTops.push(y);y+=flowStride;}
    y=(nameTops.length?nameTops.at(-1)+flowBoxH:y)+sectionGap;
  }
  const hexTops=[];
  if(showHex){
    y+=20;
    for(let i=0;i<rows.length;i++){hexTops.push(y);y+=hexStride;}
    y=(hexTops.length?hexTops.at(-1)+hexBoxH:y)+sectionGap;
  }
  const decTops=[];
  if(showDecode){
    y+=20;
    for(let i=0;i<decode.length;i++){decTops.push(y);y+=flowStride;}
    y=(decTops.length?decTops.at(-1)+flowBoxH:y)+16;
  }

  const W=Math.ceil(targetW),H=Math.ceil(Math.max(80,y));
  const out=[],put=s=>out.push(s);
  const fam='UDEV Gothic NF, sans-serif';
  const mon=fam;
  const text=(x,yy,s,color,size=16,kind='sans',weight=700,anchor='start')=>put(`<text x="${fmt(x)}" y="${fmt(yy)}" fill="${color}" font-family="${kind==='mono'?mon:fam}" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}">${escapeXML(s)}</text>`);

  function drawSimpleLayers(zone,linesOrRows,tops,heights,hitFn){
    if(!tops.length)return;
    const zoneLeft=geom.origin-11;
    const zoneRight=zone==='hex'
      ? Math.max(...rows.map(r=>geom.rowRight(r)))+11
      : Math.max(...linesOrRows.map(line=>geom.origin+line.width))+11;
    const zoneBottom=tops.at(-1)+heights.at(-1)+7;
    for(const l of layers){
      const c=BG[l.bg]||BG.ether;
      const hit=hitFn(l); if(!hit)continue;
      const depth=depths.get(l)||0;
      let d;
      if(depth===0&&l.start===0){
        const top=tops[0]-7;
        d=polygonPath([[zoneLeft,top],[zoneRight,top],[zoneRight,zoneBottom],[zoneLeft,zoneBottom]]);
      }else{
        // Keep HEX on the exact byte-cell boundary. Flow sections retain the
        // left breathing room introduced in v12/v13.
        d=startNotchPath(hit,tops,heights,zoneLeft,zoneRight,zoneBottom,zone==='hex'?0:16);
      }
      if(d)put(`<path data-zone="${zone}" data-layer="${escapeXML(l.id)}" d="${d}" fill="${c[0]}" stroke="${c[1]}" stroke-width="1.8" stroke-linejoin="miter"/>`);
    }
  }

  put(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`);

  if(showNames){
    text(geom.origin-11,nameTops[0]-17,'セグメント名','#64748B',18);
    drawSimpleLayers('name',names,nameTops,names.map(()=>flowBoxH),l=>firstFlowHit(names,l));
    for(let r=0;r<names.length;r++)for(const item of names[r].items)renderFlowToken(put,item,nameTops[r]+24,16,fam,mon);
  }

  if(showHex){
    text(geom.origin-11,hexTops[0]-17,'HEX','#64748B',18);
    const zoneLeft=geom.origin-11;
    const zoneRight=Math.max(...rows.map(r=>geom.rowRight(r)))+11;
    const zoneBottom=hexTops.at(-1)+hexBoxH+7;
    const hexRegions=[];
    for(const l of layers){
      const hit=firstHexDisplayHit(l,geom,hexCells);if(!hit)continue;
      const depth=depths.get(l)||0;
      const colors=BG[l.bg]||BG.ether;
      const d=depth===0&&l.start===0
        ? polygonPath([[zoneLeft,hexTops[0]-7],[zoneRight,hexTops[0]-7],[zoneRight,zoneBottom],[zoneLeft,zoneBottom]])
        : startNotchPath(hit,hexTops,rows.map(()=>hexBoxH),zoneLeft,zoneRight,zoneBottom,0);
      if(d)hexRegions.push({l,d,colors});
    }
    for(const region of hexRegions){
      put(`<path data-zone="hex" data-layer="${escapeXML(region.l.id)}" d="${region.d}" fill="${region.colors[0]}" stroke="none"/>`);
    }
    for(const region of hexRegions){
      put(`<path data-zone="hex" data-layer="${escapeXML(region.l.id)}" d="${region.d}" fill="none" stroke="${region.colors[1]}" stroke-width="1.4" stroke-linejoin="miter"/>`);
    }
    for(let r=0;r<rows.length;r++){
      const row=rows[r];
      for(let k=row.start;k<row.end;k++){
        const c=hexCells[k];
        const label=c.kind==='omit'?'…':hex2(a[c.srcStart]);
        text(geom.centerFor(row,k),hexTops[r]+25,label,c.color||C.plain,17,'mono',700,'middle');
      }
    }
  }

  if(showDecode){
    text(geom.origin-11,decTops[0]-17,'デコード結果','#64748B',18);
    drawSimpleLayers('decode',decode,decTops,decode.map(()=>flowBoxH),l=>firstFlowHit(decode,l));
    for(let r=0;r<decode.length;r++)for(const item of decode[r].items)renderFlowToken(put,item,decTops[r]+25,17,fam,mon);
  }

  put('</svg>');
  return out.join('\n');
}

function currentOptions(){
  return {
    cols:Number($('cols').value),asciiLimit:Number($('asciilimit').value),hexLimit:Number($('hexlimit').value),
    showNames:$('showNames').checked,showHex:$('showHex').checked,showDecode:$('showDecode').checked
  };
}

function update(){
  try{
    const a=parseHex($('hex').value),opts=currentOptions();
    if(!Number.isInteger(opts.cols)||opts.cols<8||opts.cols>36)throw Error('1行: 8〜36');
    if(!Number.isInteger(opts.asciiLimit)||opts.asciiLimit<16||opts.asciiLimit>8000)throw Error('ASCII上限: 16〜8000');
    if(!Number.isInteger(opts.hexLimit)||opts.hexLimit<16||opts.hexLimit>8000)throw Error('HEX上限: 16〜8000');
    const p=classify(a,{mode:$('mode').value,asciiLimit:opts.asciiLimit});
    const svg=renderSVGv17(a,p,opts);
    $('view').innerHTML=svg;
    sourceSVG='<?xml version="1.0" encoding="UTF-8"?>\n'+svg;
    $('error').textContent=p.warnings.join(' ');
    $('saveSvg').disabled=false;$('savePng').disabled=false;
  }catch(e){
    $('error').textContent=e.message;sourceSVG='';$('view').innerHTML='';
    $('saveSvg').disabled=true;$('savePng').disabled=true;
  }
}

function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function saveSVG(){
  if(!sourceSVG)return;
  downloadBlob(new Blob([sourceSVG],{type:'image/svg+xml;charset=utf-8'}),'packet_protocol.svg');
}
function savePNG(){
  if(!sourceSVG)return;
  const svg=$('view').querySelector('svg'); if(!svg)return;
  const w=Number(svg.getAttribute('width')),h=Number(svg.getAttribute('height')),scale=2;
  const blob=new Blob([sourceSVG],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();
  img.onload=()=>{
    const canvas=document.createElement('canvas');canvas.width=Math.ceil(w*scale);canvas.height=Math.ceil(h*scale);
    const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    canvas.toBlob(png=>{if(png)downloadBlob(png,'packet_protocol.png');},'image/png');
  };
  img.onerror=()=>{URL.revokeObjectURL(url);$('error').textContent='PNG変換に失敗しました。';};
  img.src=url;
}

$('hex').value=EXAMPLE;
for(const id of ['hex','cols','asciilimit','hexlimit','showNames','showHex','showDecode'])$(id).addEventListener('input',update);
$('mode').addEventListener('change',update);
$('sample').addEventListener('click',()=>{$('hex').value=EXAMPLE;$('cols').value=26;$('mode').value='auto';$('asciilimit').value=256;$('hexlimit').value=256;$('showNames').checked=true;$('showHex').checked=true;$('showDecode').checked=true;update();});
$('saveSvg').addEventListener('click',saveSVG);
$('savePng').addEventListener('click',savePNG);
update();
window.__packetGenerator={classify,parseHex,renderSVG:renderSVGv17,asciiPreview,buildFields,fixedPacketRows,getCurrent:()=>sourceSVG};
})();

</script>
